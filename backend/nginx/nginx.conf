worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # ip_hash gives sticky sessions per client IP, required so a given
  # WebSocket's polling-fallback handshake always lands on the same
  # Socket.IO instance. In production behind a CDN, prefer a cookie-based
  # sticky method (e.g. nginx-sticky-module) since many clients share IPs.
  upstream novachat_api {
    ip_hash;
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
    server api3:4000 max_fails=3 fail_timeout=10s;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  # Basic response caching for static-ish GETs; real-time endpoints bypass this.
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=novachat_cache:10m max_size=512m inactive=30m;

  server {
    listen 80;
    server_name novachat.io;

    client_max_body_size 100m;

    location /health {
      proxy_pass http://novachat_api;
      access_log off;
    }

    location /socket.io/ {
      proxy_pass http://novachat_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s; # keep long-lived WebSocket connections open
    }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://novachat_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
