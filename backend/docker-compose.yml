version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

  api1:
    build: .
    environment:
      - INSTANCE_ID=server-1
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/novachat?replicaSet=rs0
      - REDIS_HOST=redis
    env_file: .env
    depends_on: [mongo1, redis]
    restart: unless-stopped

  api2:
    build: .
    environment:
      - INSTANCE_ID=server-2
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/novachat?replicaSet=rs0
      - REDIS_HOST=redis
    env_file: .env
    depends_on: [mongo1, redis]
    restart: unless-stopped

  api3:
    build: .
    environment:
      - INSTANCE_ID=server-3
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/novachat?replicaSet=rs0
      - REDIS_HOST=redis
    env_file: .env
    depends_on: [mongo1, redis]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  mongo1:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1-data:/data/db
    restart: unless-stopped

  mongo2:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
    restart: unless-stopped

  mongo3:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
    restart: unless-stopped

volumes:
  redis-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:
